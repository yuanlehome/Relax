claude_code:
  max_turns: 200
  max_context_tokens: 262144
  allowed_tools: Bash,Read,Edit,Write,Glob,Grep,TaskCreate,TaskGet,TaskList,TaskUpdate,Skill
  disallowed_tools: ListAgents,ReportFindings,SendMessage,WebSearch,WebFetch,AskUserQuestion,Agent,NotebookEdit,EnterPlanMode,ExitPlanMode,EnterWorktree,ExitWorktree,ScheduleWakeup,TaskOutput,TaskStop,mcp__*
  skill_overrides:
    auto-mode-setup: "off"
    batch: "off"
    claude-api: "off"
    code-review: "off"
    dataviz: "off"
    debug: "off"
    doctor: "off"
    fewer-permission-prompts: "off"
    init: "off"
    keybindings-help: "off"
    loop: "off"
    plugin-authoring: "off"
    run: "on"
    run-skill-generator: "off"
    security-review: "off"
    simplify: "off"
    update-config: "off"
    verify: "on"

apptainer:
  pids_limit: 8192

task:
  cpus: 4
  memory_mb: 16384
  agent_timeout_sec: 864000
  verifier_timeout_sec: 180
